<section class="timeline-chat">
  <p class="identity">
    <strong>{{timeline().character}}</strong>
    <small>Winden, <time [attr.datetime]="timeline().year">{{timeline().year}}</time></small>
  </p>
  <ol #log class="messages" aria-live="polite">
    @for (m of messages(); track m.id) {
      <li>
        <header>
          <cite>{{m.from}}</cite>
          <small>{{m.to === all ? 'to all' : 'to you'}}</small>
          <time [attr.datetime]="m.at.toISOString()">{{m.at | date: 'HH:mm:ss'}}</time>
        </header>
        <p>{{m.text}}</p>
      </li>
    } @empty {
      <li class="empty">No messages yet</li>
    }
  </ol>
  <form (submit)="send($event)">
    <label>
      To
      <select (change)="setRecipient($event)">
        <option [value]="all">{{all}}</option>
        @for (year of recipients(); track year) {
          <option [value]="year">{{year}}</option>
        }
      </select>
    </label>
    <label>
      Message
      <input type="text" autocomplete="off" [value]="draft()" (input)="setDraft($event)">
    </label>
    <button type="submit">Send</button>
  </form>
</section>
