<article role="alertdialog" *transloco="let t">
  <header class="wormhole-dialog-header">
    <h4>{{dialogData()?.status}} — {{dialogData()?.statusText}}</h4>
  </header>
  <section class="wormhole-dialog-body">
    <p>{{dialogData()?.error?.message ?? dialogData()?.message}}</p>
  </section>
  <footer class="wormhole-dialog-footer">
    <button type="button" class="wormhole-btn wormhole-btn-primary" (click)="close()">
      {{t('button.close')}}
    </button>
  </footer>
</article>
