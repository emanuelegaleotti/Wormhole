@if (weather(); as w) {
  <dl>
    <dt>City:</dt>
    <dd>{{w.name}}</dd>
    <dt>Temperature:</dt>
    <dd>{{w.temp | toCelsius}}</dd>
    <dt>Min Temperature:</dt>
    <dd>{{w.temp_min | toCelsius}}</dd>
    <dt>Max Temperature:</dt>
    <dd>{{w.temp_max | toCelsius}}</dd>
    <dt>Humidity:</dt>
    <dd>{{w.humidity}}</dd>
    <dt>Pressure:</dt>
    <dd>{{w.pressure}}</dd>
  </dl>
  @for (d of w.weather; track $index) {
    <dl>
      <dt>{{d.main}}</dt>
      <dd>{{d.description}}</dd>
    </dl>
  }
}
