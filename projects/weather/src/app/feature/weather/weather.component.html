@if (weather(); as w) {
  <section class="weather">
    <header>
      <h5>{{w.name}}</h5>
      <p class="temperature">{{w.temp | toCelsius}}</p>
      @for (d of w.weather; track $index) {
        <p class="condition">{{d.main}} <small>{{d.description}}</small></p>
      }
    </header>
    <dl>
      <div>
        <dt>Min</dt>
        <dd>{{w.temp_min | toCelsius}}</dd>
      </div>
      <div>
        <dt>Max</dt>
        <dd>{{w.temp_max | toCelsius}}</dd>
      </div>
      <div>
        <dt>Humidity</dt>
        <dd>{{w.humidity}} %</dd>
      </div>
      <div>
        <dt>Pressure</dt>
        <dd>{{w.pressure}} hPa</dd>
      </div>
    </dl>
  </section>
}
