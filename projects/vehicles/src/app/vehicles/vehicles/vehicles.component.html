<section class="wormhole-grid" *transloco="let t">
  <h2>
    {{t('vehicles.vehicles.title')}}
  </h2>
  @if (vehicles().length) {
    <article>
      <table>
        <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        @for (p of vehicles(); track p.id) {
          <tr>
            <td>{{p.id}}</td>
            <td>{{p.name}}</td>
            <td><a [routerLink]="p.id">Detail</a></td>
          </tr>
        }
        </tbody>
      </table>
      <app-pager [totalItems]="allVehicles()" (whenPageSelected)="setPage($event)"></app-pager>
    </article>
  } @else {
    <article class="wormhole-alert">
      {{t('vehicles.vehicles.noResult')}}
    </article>
  }
</section>
