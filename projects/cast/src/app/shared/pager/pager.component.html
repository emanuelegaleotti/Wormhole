<nav class="lorenz-pager" aria-label="Pagination">
  <button type="button" (click)="setPage(1)" aria-label="First page"><<</button>
  <button type="button" (click)="setPage(currentPage() - 1)" aria-label="Previous page"><</button>
  <ul class="pagination">
    @for (p of pages(); track p) {
      <li>
        <button type="button"
                class="page"
                [attr.aria-current]="p === currentPage() ? 'page' : null"
                (click)="setPage(p)">{{p}}</button>
      </li>
    }
  </ul>
  <button type="button" (click)="setPage(currentPage() + 1)" aria-label="Next page">></button>
  <button type="button" (click)="setPage(pagesLength())" aria-label="Last page">>></button>
</nav>
